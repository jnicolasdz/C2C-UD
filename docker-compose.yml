services:
  frontend:
    image: nginx:alpine
    container_name: c2c_ud_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - coupon
      - email
      - geolocation
      - report
    restart: unless-stopped

  coupon:
    build:
      context: ./services/coupon
      dockerfile: Dockerfile
    container_name: coupon_service
    ports:
      - "8001:8000"
    volumes:
      - ./services/coupon:/app
    environment:
      - PORT=8000
    restart: unless-stopped

  email:
    build:
      context: ./services/email
      dockerfile: Dockerfile
    container_name: email_service
    ports:
      - "8002:8000"
    volumes:
      - ./services/email:/app
    environment:
      - PORT=8000
      - SMTP_USERNAME=c2cudistrital@gmail.com
      - SMTP_PASSWORD=pzue guqt sfso uwed
      - SMTP_FROM=c2cudistrital@gmail.com
      - EMAIL_SERVICE_API_KEY=dev-api-key
      - ALLOWED_INSTITUTIONAL_DOMAIN=udistrital.edu.co
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USE_TLS=false
      - SMTP_USE_SSL=false
      - SMTP_TIMEOUT=30
    depends_on:
      mailpit:
        condition: service_started
    restart: unless-stopped

  geolocation:
    build:
      context: ./services/geolocation
      dockerfile: Dockerfile
    container_name: geolocation_service
    ports:
      - "8003:8000"
    volumes:
      - ./services/geolocation:/app
    environment:
      - PORT=8000
    restart: unless-stopped

  report:
    build:
      context: ./services/report
      dockerfile: Dockerfile
    container_name: report_service
    ports:
      - "8004:8000"
    volumes:
      - ./services/report:/app
    env_file:
      - ./services/report/.env
    environment:
      - PORT=8000
    depends_on:
      report_db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  report_db:
    image: postgres:16-alpine
    container_name: report_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace_reports
    ports:
      - "5434:5432"
    volumes:
      - reports_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_reports"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: report_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  reports_db_data:
